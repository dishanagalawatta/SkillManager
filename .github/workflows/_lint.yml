name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Ruff check + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Ruff check + format
        run: |
          RUFF_VERSION=$(sed -n '/name = "ruff"/,/version =/p' uv.lock | grep -m1 'version = ' | cut -d'"' -f2)
          uvx --from "ruff==$RUFF_VERSION" ruff check src tests
          uvx --from "ruff==$RUFF_VERSION" ruff format --check src tests
