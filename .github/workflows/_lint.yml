name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff check + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Ruff check + format
        run: |
          set -euo pipefail
          # --- Robust ruff version extraction with fallbacks ---
          # 1) Parse uv.lock via Python regex (immune to line-order changes)
          # 2) Parse pyproject.toml dependency-groups / optional-dependencies
          # 3) Fall back to unpinned uvx (always works, just not reproducible)
          RUFF_VERSION=""
          if [ -f uv.lock ]; then
            RUFF_VERSION=$(python3 - << 'PY' 2>/dev/null || true
          import re, pathlib
          p = pathlib.Path("uv.lock")
          if p.exists():
              text = p.read_text(encoding="utf-8", errors="ignore")
              m = re.search(r'\[\[package\]\]\s*name\s*=\s*"ruff"\s*version\s*=\s*"([^"]+)"', text)
              if m:
                  print(m.group(1).strip())
          PY
            )
          fi
          if [ -z "$RUFF_VERSION" ] && [ -f pyproject.toml ]; then
            RUFF_VERSION=$(python3 - << 'PY' 2>/dev/null || true
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          if p.exists():
              text = p.read_text(encoding="utf-8", errors="ignore")
              # dependency-groups dev = ["ruff>=0.8.0", ...] or optional-dependencies
              for pat in [r'"ruff[^"]*>=([0-9.]+)"', r'"ruff==([0-9.]+)"', r"'ruff[^']*>=([0-9.]+)'"]:
                  import re as _re
                  m = _re.search(pat, text)
                  if m:
                      print(m.group(1).strip())
                      break
          PY
            )
          fi
          # Normalise: strip whitespace/newlines
          RUFF_VERSION=$(echo "$RUFF_VERSION" | tr -d '[:space:]')
          if [ -n "$RUFF_VERSION" ]; then
            echo "Using pinned ruff $RUFF_VERSION"
            uvx --from "ruff==$RUFF_VERSION" ruff check src tests
            uvx --from "ruff==$RUFF_VERSION" ruff format --check src tests
          else
            echo "::warning::Could not resolve ruff version; falling back to unpinned uvx ruff"
            uvx ruff check src tests
            uvx ruff format --check src tests
          fi

  pin-guard:
    name: Action pin guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail on floating action refs
        run: |
          set -euo pipefail
          # Every third-party 'uses' step must reference an immutable 40-char
          # commit SHA. Local './' and '$/' refs resolve to the running commit
          # and are exempt. Prints file:line for each violation, then fails.
          violations=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]*(\./|\$/)' \
            | grep -vE '@[0-9a-f]{40}([^0-9a-f]|$)' || true)
          if [ -n "$violations" ]; then
            echo "::error::Floating action references found — pin each to a full commit SHA:"
            echo "$violations"
            exit 1
          fi
          echo "All third-party actions are SHA-pinned."

  zizmor:
    name: Zizmor workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows/
          online-audits: "false"
          advanced-security: "false"
          version: v1.30.1
          config: .github/zizmor.yml
