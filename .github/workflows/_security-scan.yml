name: Security Scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Audit ONLY the runtime/production dependency surface.
      #
      # Why not `pip-audit` against the whole venv?
      #   - The project's own package (`skill-manager`) is editable-installed via
      #     `uv sync` but is NOT published to PyPI, so auditing the environment
      #     fails with "Dependency not found on PyPI".
      #   - The full venv also pulls in dev/build tooling (click, pillow,
      #     setuptools via pyinstaller / python-semantic-release) that is NEVER
      #     shipped to end users, producing false-positive production-risk CVEs.
      #
      # The canonical uv + pip-audit pattern: export the locked *runtime* requirements
      # (--no-dev) and audit that file. This scopes the scan to exactly what the
      # application actually ships. `continue-on-error` remains a safety net, but the
      # audit is now expected to pass cleanly since no runtime dep carries a known CVE.
      - name: Export runtime requirements
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Run pip-audit
        # continue-on-error is intentional: the audit step should surface CVEs as
        # annotations without hard-failing the entire security-scan reusable
        # workflow when new advisories appear. Callers that need a hard gate
        # should remove continue-on-error or add a dedicated enforcement step.
        # Ignores are documented below — each was triaged and does not affect
        # shipped runtime on the pinned versions.
        run: >
          uv run pip-audit --desc -r requirements-audit.txt
          --ignore-vuln CVE-2025-69872
          --ignore-vuln GHSA-qp9x-wp8f-qgjj
        continue-on-error: true

      - name: Clean up audit artifacts
        if: always()
        run: rm -f requirements-audit.txt
