name: Auto Version & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
      - '.agents/**'
      - 'image/**'
      - 'conductor/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  auto-release:
    name: Auto Detect Release & Bump Version
    # Prevent infinite loop: semantic-release commits include [skip ci] and
    # this guard skips those pushes so auto-release does not trigger itself.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --only-group dev

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Automated Release & Version Sync
        id: release
        run: |
          set -euo pipefail
          OLD_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          uv run python scripts/release.py auto --only-if-triggered --skip-tests --skip-lint
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$OLD_TAG" ]; then
            echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "RELEASED=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Release Build Workflow
        if: steps.release.outputs.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.NEW_TAG }}"
          echo "Triggering release-build.yml for tag: $TAG"
          gh workflow run release-build.yml --ref "$TAG" || echo "::warning::gh workflow run failed — trigger release-build manually for $TAG"
