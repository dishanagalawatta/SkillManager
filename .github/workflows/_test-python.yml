name: Test Python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version to test
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ inputs.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        shell: bash
        run: |
          set +e
          # The phantom console Ctrl+C also reaches the step shell. Under bash,
          # SIGINT received while waiting on a foreground child is deferred and
          # re-raised the moment the child exits, killing the script before it
          # can propagate pytest's real exit code. Ignoring SIGINT lets the
          # runner see the true result; pytest itself still swallows the
          # console event via the windows_ci_sigint_guard fixture.
          trap '' INT
          uv run pytest --cov=skill_manager --cov-report=xml --cov-report=term-missing \
            -q --full-trace
          code=$?
          trap - INT
          echo "UV_RUN_PYTEST_EXIT=$code"
          exit $code
        env:
          QT_QPA_PLATFORM: offscreen
          SKILL_MANAGER_WIN_SIGINT_GUARD: "1"

      - name: QML selector smoke check
        shell: bash
        run: uv run python scripts/verify_command_selector_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
          SKILL_MANAGER_WIN_SIGINT_GUARD: "1"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows-py${{ inputs.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce coverage threshold
        if: always()
        shell: bash
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::warning::coverage.xml not found — skipping fail-under check (tests may have failed before coverage was written)"
            exit 0
          fi
          uv run coverage report --fail-under=80
