name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
      - '.agents/**'
      - 'image/**'
      - 'conductor/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
      - '.agents/**'
      - 'image/**'
      - 'conductor/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  test-py312:
    name: "Test (Py 3.12)"
    uses: ./.github/workflows/_test-python.yml
    with:
      python-version: "3.12"

  test-py313:
    name: "Test (Py 3.13)"
    uses: ./.github/workflows/_test-python.yml
    with:
      python-version: "3.13"

  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, test-py312, test-py313]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test-py312.result }}" != "success" ]]; then
            echo "Test (Py 3.12) failed"
            exit 1
          fi
          if [[ "${{ needs.test-py313.result }}" != "success" ]]; then
            echo "Test (Py 3.13) failed"
            exit 1
          fi
          echo "All checks passed"
