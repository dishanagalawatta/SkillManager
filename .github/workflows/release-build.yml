name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --only-group dev

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Decode signing cert
        if: ${{ env.WIN_PFX_B64 != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}\packaging\windows\certs" -Force | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.WIN_PFX_B64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\packaging\windows\certs\code-signing.pfx", $bytes)
        env:
          WIN_PFX_B64: ${{ secrets.WIN_PFX_B64 }}

      - name: Build installer
        shell: pwsh
        run: |
          if ("${{ secrets.WIN_PFX_B64 }}" -ne "") {
            .\packaging\windows\build.ps1
          } else {
            .\packaging\windows\build.ps1 -SkipSign
          }
        env:
          WIN_PFX_PASS: ${{ secrets.WIN_PFX_PASS }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SkillManager_Setup
          path: dist/SkillManager_Setup.exe

  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --only-group dev

      - name: Build PyInstaller bundle
        run: uv run python -m PyInstaller --noconfirm packaging/skill_manager.spec

      - name: Install appimagetool (no FUSE)
        run: |
          cd "${{ runner.temp }}"
          # Maintained standalone repo (AppImage/AppImageKit is archived and its
          # "continuous" build predates root-level .desktop discovery).
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          # Keep the whole tree and symlink AppRun into PATH: AppRun resolves
          # the real binary via readlink -f relative to itself, so moving only
          # AppRun to /usr/local/bin would break that resolution.
          sudo mv squashfs-root /usr/local/appimagetool
          sudo ln -s /usr/local/appimagetool/AppRun /usr/local/bin/appimagetool
          rm -f appimagetool

      - name: Build Linux artifacts
        run: uv run python scripts/build_linux.py --all

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SkillManager_Linux
          path: |
            dist/*.AppImage
            dist/*.deb

  publish-release:
    needs: [build-windows, linux-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: SkillManager_Setup
          path: dist/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: SkillManager_Linux
          path: dist/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Determine prerelease flag
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [[ "$VERSION" == *-dev.* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute SHA256
        id: sha256
        run: |
          HASH=$(sha256sum dist/SkillManager_Setup.exe | cut -d' ' -f1)
          echo "HASH=$HASH" >> $GITHUB_OUTPUT

      - name: Generate SHA256SUMS
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SkillManager ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          files: |
            dist/SkillManager_Setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Echo SHA256
        run: |
          echo "Installer SHA256: ${{ steps.sha256.outputs.HASH }}"
          echo "Checksums: dist/SHA256SUMS"
          echo "Use this hash in winget manifest installer.yaml"
